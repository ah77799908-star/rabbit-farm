<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>مزرعة الأرانب</title>
<style>
:root{--g:#2f6b4f;--g2:#e6f2ea;--bg:#f6f4ee;--c:#fff;--t:#222;--m:#777;--o:#e08a1e;--r:#c0392b;--b:#2b6cb0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);padding-bottom:84px;font-size:16px}
header{background:linear-gradient(135deg,#2f6b4f,#3f8c68);color:#fff;padding:18px 16px 22px;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:5;box-shadow:0 3px 10px #0003}
header h1{margin:0;font-size:21px}header small{opacity:.85}
main{padding:14px;max-width:720px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--c);border-radius:16px;padding:12px;text-align:center;box-shadow:0 1px 4px #0001}
.stat b{display:block;font-size:26px;color:var(--g)}.stat span{font-size:13px;color:var(--m)}
.card{background:var(--c);border-radius:16px;padding:13px;margin:10px 0;box-shadow:0 1px 4px #0001}
.card h3{margin:0 0 8px;font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee}
.row:last-child{border:0}
.tag{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--g2);color:var(--g);white-space:nowrap}
.tag.o{background:#fdeed8;color:#a45f06}.tag.r{background:#fbe0dc;color:var(--r)}.tag.b{background:#dfeafa;color:var(--b)}.tag.x{background:#eee;color:#666}
.m{color:var(--m);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;box-shadow:0 -2px 12px #0002;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 2px 7px;font-size:11px;color:var(--m);font-family:inherit}
nav button i{display:block;font-style:normal;font-size:22px}
nav button.on{color:var(--g);font-weight:700}
.fab{position:fixed;bottom:76px;left:16px;width:58px;height:58px;border-radius:50%;border:0;background:var(--o);color:#fff;font-size:32px;box-shadow:0 4px 12px #0005;z-index:7}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--g);color:#fff;font-size:15px;font-family:inherit}
.btn.s{background:var(--g2);color:var(--g)}.btn.d{background:#fbe0dc;color:var(--r)}.btn.sm{padding:6px 12px;font-size:13px}
.sheet-bg{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:18px}
label{display:block;margin:10px 0 4px;font-size:14px;color:#444}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:16px;font-family:inherit;background:#fafafa}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.acts .btn{padding:14px 8px;font-size:15px}
.empty{text-align:center;color:var(--m);padding:22px 10px}
.search{margin:4px 0 8px}
.chips{display:flex;gap:6px;overflow:auto;margin-bottom:6px}.chips button{border:1px solid #ccc;background:#fff;border-radius:20px;padding:6px 13px;font-family:inherit;white-space:nowrap}.chips .on{background:var(--g);color:#fff;border-color:var(--g)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:50}
</style></head><body>
<header><h1>🐇 مزرعة الأرانب</h1><small id="sub"></small></header>
<main id="app"></main>
<button class="fab" onclick="quick()">+</button>
<nav id="nav"></nav>
<script>
const KEY='rabbitfarm.v1';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{does:[],bucks:[],matings:[],births:[],sales:[],set:{gest:31,palp:14,nest:28,wean:35,rest:7},lastBackup:null};
let tab='home',filter='all',q='';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('تعذر الحفظ على الجهاز')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const diff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const fd=s=>{if(!s)return'-';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const doe=id=>S.does.find(d=>d.id==id);
const dn=id=>{const d=doe(id);return d?d.num:'؟'};
function ago(n){return n===0?'اليوم':n===1?'أمس':n>0?'من '+n+' يوم':'بعد '+(-n)+' يوم'}
// status of a doe
function status(d){
 const t=today();
 const m=S.matings.filter(x=>x.doe==d.id&&x.result==='pending').sort((a,b)=>b.date.localeCompare(a.date))[0];
 if(m)return{k:'preg',m,due:addD(m.date,S.set.gest)};
 const b=S.births.filter(x=>x.doe==d.id&&!x.weaned&&x.alive>0).sort((a,b)=>b.date.localeCompare(a.date))[0];
 if(b)return{k:'nurs',b,wean:addD(b.date,S.set.wean)};
 return{k:'free'};
}
const stTag=d=>{const s=status(d);return s.k==='preg'?'<span class="tag o">🤰 حامل - ولادة '+fd(s.due)+'</span>':s.k==='nurs'?'<span class="tag b">🍼 مرضعة ('+s.b.alive+' صغير)</span>':'<span class="tag">✅ فاضية</span>'};
// ---------- render
function render(){
 document.getElementById('sub').textContent=S.does.length+' أنثى • '+S.bucks.length+' ذكر • '+today().split('-').reverse().join('/');
 document.getElementById('nav').innerHTML=[['home','🏠','الرئيسية'],['does','🐰','الإناث'],['log','📒','السجل'],['sales','💰','المبيعات'],['more','⚙️','المزيد']].map(x=>`<button class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('');
 const v={home,does,log,sales,more}[tab];
 document.getElementById('app').innerHTML=v();window.scrollTo(0,0);
}
function go(t){tab=t;render()}
function alerts(){
 const t=today(),A=[];
 S.does.forEach(d=>{const s=status(d);
  if(s.k==='preg'){const left=diff(s.due,t),dd=diff(t,s.m.date);
   if(left<0)A.push({p:0,c:'r',i:'⚠️',t:`الأنثى ${d.num}: متأخرة عن الولادة ${-left} يوم`,d:d.id});
   else if(left<=3)A.push({p:1,c:'o',i:'🍼',t:`الأنثى ${d.num}: الولادة ${left==0?'اليوم':'بعد '+left+' يوم'} (${fd(s.due)})`,d:d.id});
   else if(dd>=S.set.nest&&left>3)A.push({p:2,c:'o',i:'📦',t:`الأنثى ${d.num}: جهّز بيت الولادة`,d:d.id});
   if(dd>=S.set.palp&&dd<S.set.palp+4&&!s.m.palpated)A.push({p:3,c:'b',i:'🔍',t:`الأنثى ${d.num}: وقت جس الحمل (يوم ${dd})`,d:d.id});
  }
  if(s.k==='nurs'){const left=diff(s.wean,t);
   if(left<=0)A.push({p:2,c:'b',i:'✂️',t:`الأنثى ${d.num}: وقت الفطام ${left<0?'(متأخر '+(-left)+' يوم)':'اليوم'}`,d:d.id});
   else if(left<=3)A.push({p:4,c:'b',i:'✂️',t:`الأنثى ${d.num}: الفطام بعد ${left} يوم`,d:d.id});}
 });
 return A.sort((a,b)=>a.p-b.p);
}
function home(){
 const pre=S.does.filter(d=>status(d).k==='preg').length,nu=S.does.filter(d=>status(d).k==='nurs').length;
 const kits=S.births.filter(b=>!b.weaned).reduce((a,b)=>a+(b.alive||0),0);
 const mo=today().slice(0,7);const sm=S.sales.filter(s=>s.date.startsWith(mo));
 const A=alerts();
 let h=`<div class="grid"><div class="stat"><b>${S.does.length}</b><span>إجمالي الإناث</span></div><div class="stat"><b>${pre}</b><span>حوامل</span></div><div class="stat"><b>${nu}</b><span>مرضعات</span></div><div class="stat"><b>${kits}</b><span>صغار لسه مع أمهاتها</span></div></div>`;
 h+=`<div class="card"><h3>🔔 تنبيهات</h3>`+(A.length?A.map(a=>`<div class="row" onclick="doeView('${a.d}')"><span>${a.i} ${a.t}</span></div>`).join(''):'<div class="empty">مفيش تنبيهات دلوقتي 👌</div>')+'</div>';
 h+=`<div class="card"><h3>💰 مبيعات الشهر</h3><div class="row"><span>${sm.reduce((a,s)=>a+s.count,0)} أرنب</span><b>${sm.reduce((a,s)=>a+s.total,0)} جنيه</b></div></div>`;
 const up=S.does.map(d=>({d,s:status(d)})).filter(x=>x.s.k==='preg').sort((a,b)=>a.s.due.localeCompare(b.s.due)).slice(0,6);
 if(up.length)h+=`<div class="card"><h3>📅 الولادات القادمة</h3>`+up.map(x=>`<div class="row" onclick="doeView('${x.d.id}')"><b>${esc(x.d.num)}</b><span class="m">مع ${esc(x.s.m.buck||'؟')}</span><span class="tag o">${fd(x.s.due)}</span></div>`).join('')+'</div>';
 if(!S.does.length)h+=`<div class="card empty">ابدأ بإضافة أول أنثى من زر <b>+</b> أو من تبويب الإناث 🐰</div>`;
 return h;
}
function does(){
 let L=S.does.filter(d=>(!q||String(d.num).includes(q))&&(filter==='all'||status(d).k===filter));
 L.sort((a,b)=>String(a.num).localeCompare(String(b.num),undefined,{numeric:true}));
 const ch=[['all','الكل'],['free','فاضية'],['preg','حوامل'],['nurs','مرضعات']].map(c=>`<button class="${filter==c[0]?'on':''}" onclick="filter='${c[0]}';render()">${c[1]}</button>`).join('');
 return `<input class="search" placeholder="🔎 دوّر برقم الأنثى" value="${esc(q)}" oninput="q=this.value;clearTimeout(window.qt);window.qt=setTimeout(()=>{render();const e=document.querySelector('.search');e.focus();e.setSelectionRange(99,99)},300)"><div class="chips">${ch}</div>`+
 (L.length?`<div class="card">`+L.map(d=>`<div class="row" onclick="doeView('${d.id}')"><b style="font-size:19px">${esc(d.num)}</b>${stTag(d)}</div>`).join('')+'</div>':'<div class="empty">لا يوجد</div>')+
 `<button class="btn" style="width:100%" onclick="doeForm()">+ إضافة أنثى</button> <button class="btn s" style="width:100%;margin-top:8px" onclick="bulkForm()">+ إضافة عدة إناث مرة واحدة</button>`;
}
function log(){
 const E=[];
 S.matings.forEach(m=>E.push({date:m.date,i:'💕',t:`تزاوج: ${dn(m.doe)} × ${esc(m.buck||'؟')}`,tag:m.result==='pending'?'<span class="tag o">منتظرة</span>':m.result==='born'?'<span class="tag">ولدت</span>':'<span class="tag r">فشل</span>',kind:'m',id:m.id}));
 S.births.forEach(b=>E.push({date:b.date,i:'🍼',t:`ولادة ${dn(b.doe)}: ${b.alive} حي${b.dead?' + '+b.dead+' نافق':''}`,tag:b.weaned?`<span class="tag b">فُطم ${b.weanedCount} (${fd(b.weanDate)})</span>`:'',kind:'b',id:b.id}));
 E.sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="card"><h3>📒 كل الأحداث</h3>`+(E.length?E.map(e=>`<div class="row"><span>${e.i} ${e.t}<div class="m">${fd(e.date)}</div></span><span>${e.tag}<button class="btn d sm" onclick="del('${e.kind}','${e.id}')">حذف</button></span></div>`).join(''):'<div class="empty">لسه مفيش تسجيلات</div>')+'</div>';
}
function sales(){
 const tc=S.sales.reduce((a,s)=>a+s.count,0),tt=S.sales.reduce((a,s)=>a+s.total,0);
 return `<div class="grid"><div class="stat"><b>${tc}</b><span>إجمالي المباع</span></div><div class="stat"><b>${tt}</b><span>إجمالي جنيه</span></div></div>
 <button class="btn" style="width:100%;margin-top:10px" onclick="saleForm()">+ تسجيل بيع</button>
 <div class="card">`+(S.sales.length?[...S.sales].sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<div class="row"><span>${s.count} أرنب${s.doe?' (من أم '+esc(dn(s.doe))+')':''}<div class="m">${fd(s.date)} ${s.buyer?'• '+esc(s.buyer):''}</div></span><span><b>${s.total} ج</b> <button class="btn d sm" onclick="del('s','${s.id}')">حذف</button></span></div>`).join(''):'<div class="empty">لسه مفيش مبيعات</div>')+'</div>';
}
function more(){
 const s=S.set;
 return `<div class="card"><h3>🐇 الذكور</h3>`+S.bucks.map(b=>`<div class="row"><b>${esc(b)}</b><button class="btn d sm" onclick="delBuck('${esc(b)}')">حذف</button></div>`).join('')+`<button class="btn s" onclick="buckForm()">+ إضافة ذكر</button></div>
 <div class="card"><h3>⏱️ مواعيد (بالأيام)</h3><div class="m">الأرقام دي تقديرات شائعة، عدّلها حسب خبرتك</div>
 ${[['gest','مدة الحمل'],['palp','جس الحمل بعد'],['nest','تجهيز بيت الولادة بعد'],['wean','الفطام بعد الولادة بـ']].map(x=>`<label>${x[1]}</label><input type="number" inputmode="numeric" value="${s[x[0]]}" onchange="S.set.${x[0]}=+this.value||${s[x[0]]};save();render()">`).join('')}</div>
 <div class="card"><h3>💾 نسخة احتياطية</h3><div class="m">آخر نسخة: ${S.lastBackup?fd(S.lastBackup):'لسه محصلتش'}<br>البيانات محفوظة على تليفونك فقط. خد نسخة كل فترة وابعتها لنفسك على واتساب.</div>
 <div class="acts"><button class="btn" onclick="exportData()">⬇️ حفظ نسخة</button><button class="btn s" onclick="document.getElementById('imp').click()">⬆️ استرجاع نسخة</button></div>
 <input type="file" id="imp" accept=".json,application/json" hidden onchange="importData(this)"></div>
 <div class="card"><button class="btn s" onclick="exportCSV()" style="width:100%">📊 تصدير الحسابات Excel (CSV)</button></div>`;
}
// ---------- sheet
function sheet(title,body){const e=document.createElement('div');e.className='sheet-bg';e.id='sh';e.onclick=ev=>{if(ev.target===e)closeS()};e.innerHTML=`<div class="sheet"><h2>${title}</h2>${body}</div>`;document.body.appendChild(e)}
function closeS(){const e=document.getElementById('sh');if(e)e.remove()}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
const V=id=>document.getElementById(id).value;
const doeOpts=(sel,f)=>S.does.filter(f||(()=>true)).sort((a,b)=>String(a.num).localeCompare(String(b.num),undefined,{numeric:true})).map(d=>`<option value="${d.id}" ${d.id==sel?'selected':''}>${esc(d.num)}</option>`).join('');
const buckOpts=()=>S.bucks.map(b=>`<option>${esc(b)}</option>`).join('')+'<option value="">غير معروف</option>';
function quick(){sheet('تسجيل سريع',`<div class="acts"><button class="btn" onclick="closeS();matingForm()">💕 تزاوج</button><button class="btn" onclick="closeS();birthForm()">🍼 ولادة</button><button class="btn" onclick="closeS();weanForm()">✂️ فطام</button><button class="btn" onclick="closeS();saleForm()">💰 بيع</button><button class="btn s" onclick="closeS();doeForm()">🐰 أنثى جديدة</button><button class="btn s" onclick="closeS();checkForm()">🔍 نتيجة جس</button></div>`)}
function doeForm(){sheet('إضافة أنثى',`<label>رقم الأنثى</label><input id="f1" inputmode="text" placeholder="مثال: 12"><label>السلالة / ملاحظات (اختياري)</label><input id="f2"><div class="acts"><button class="btn" onclick="saveDoe()">حفظ</button><button class="btn s" onclick="closeS()">إلغاء</button></div>`)}
function saveDoe(){const n=V('f1').trim();if(!n)return toast('اكتب الرقم');if(S.does.some(d=>String(d.num)==n))return toast('الرقم ده موجود');S.does.push({id:uid(),num:n,note:V('f2')});save();closeS();render();toast('تمت الإضافة')}
function bulkForm(){sheet('إضافة عدة إناث',`<div class="m">اكتب من رقم لرقم (مثلا من 1 إلى 40)</div><label>من</label><input id="f1" type="number" inputmode="numeric"><label>إلى</label><input id="f2" type="number" inputmode="numeric"><div class="acts"><button class="btn" onclick="saveBulk()">إضافة</button><button class="btn s" onclick="closeS()">إلغاء</button></div>`)}
function saveBulk(){const a=+V('f1'),b=+V('f2');if(!a||!b||b<a||b-a>500)return toast('تأكد من الأرقام');let c=0;for(let i=a;i<=b;i++)if(!S.does.some(d=>String(d.num)==String(i))){S.does.push({id:uid(),num:String(i),note:''});c++}save();closeS();render();toast('اتضاف '+c+' أنثى')}
function buckForm(){sheet('إضافة ذكر',`<label>اسم / رقم الذكر</label><input id="f1"><div class="acts"><button class="btn" onclick="const n=V('f1').trim();if(n&&!S.bucks.includes(n)){S.bucks.push(n);save();closeS();render()}">حفظ</button><button class="btn s" onclick="closeS()">إلغاء</button></div>`)}
function delBuck(b){if(confirm('حذف الذكر '+b+'؟ (السجلات القديمة تفضل)')){S.bucks=S.bucks.filter(x=>x!==b);save();render()}}
function matingForm(id){
 if(!S.does.length)return toast('ضيف إناث الأول');
 sheet('💕 تسجيل تزاوج',`<label>الأنثى</label><select id="f1">${doeOpts(id)}</select><label>الذكر</label><select id="f2">${buckOpts()}</select>${S.bucks.length?'':'<div class="m">ضيف الذكور من تبويب المزيد</div>'}<label>التاريخ</label><input type="date" id="f3" value="${today()}"><div class="m" id="est"></div><div class="acts"><button class="btn" onclick="saveMating()">حفظ</button><button class="btn s" onclick="closeS()">إلغاء</button></div>`);
 const u=()=>document.getElementById('est').textContent='الولادة المتوقعة: '+fd(addD(V('f3'),S.set.gest));u();document.getElementById('f3').onchange=u}
function saveMating(){const d=V('f1'),dt=V('f3');if(!dt)return toast('اختار التاريخ');
 const o=S.matings.find(m=>m.doe==d&&m.result==='pending');
 if(o&&!confirm('الأنثى دي عليها تزاوج منتظر بتاريخ '+fd(o.date)+'. تسجّل تزاوج جديد برضه؟'))return;
 if(o)o.result='failed';
 S.matings.push({id:uid(),doe:d,buck:V('f2'),date:dt,result:'pending'});save();closeS();render();toast('تم - الولادة '+fd(addD(dt,S.set.gest)))}
function checkForm(id){sheet('🔍 نتيجة جس الحمل',`<label>الأنثى</label><select id="f1">${doeOpts(id,d=>status(d).k==='preg')}</select><div class="acts"><button class="btn" onclick="saveCheck(1)">حامل ✅</button><button class="btn d" onclick="saveCheck(0)">مش حامل ❌</button></div>`)}
function saveCheck(ok){const m=S.matings.find(m=>m.doe==V('f1')&&m.result==='pending');if(!m)return toast('مفيش تزاوج منتظر');if(ok)m.palpated=true;else m.result='failed';save();closeS();render()}
function birthForm(id){
 sheet('🍼 تسجيل ولادة',`<label>الأنثى</label><select id="f1">${doeOpts(id)}</select><label>تاريخ الولادة</label><input type="date" id="f3" value="${today()}"><label>عدد الصغار الأحياء</label><input type="number" inputmode="numeric" id="f4" value="0"><label>عدد النافق</label><input type="number" inputmode="numeric" id="f5" value="0"><div class="acts"><button class="btn" onclick="saveBirth()">حفظ</button><button class="btn s" onclick="closeS()">إلغاء</button></div>`)}
function saveBirth(){const d=V('f1'),a=+V('f4')||0,x=+V('f5')||0;const m=S.matings.find(m=>m.doe==d&&m.result==='pending');
 if(m)m.result='born';S.births.push({id:uid(),doe:d,matingId:m?m.id:null,buck:m?m.buck:'',date:V('f3'),alive:a,dead:x,weaned:false});save();closeS();render();toast('مبروك 🎉 الفطام '+fd(addD(V('f3'),S.set.wean)))}
function weanForm(id){const o=S.births.filter(b=>!b.weaned&&b.alive>0);if(!o.length)return toast('مفيش ولادات منتظرة فطام');
 sheet('✂️ تسجيل فطام',`<label>الولادة</label><select id="f1" onchange="document.getElementById('f4').value=S.births.find(b=>b.id==this.value).alive">${o.map(b=>`<option value="${b.id}" ${b.doe==id?'selected':''}>أنثى ${esc(dn(b.doe))} - ${fd(b.date)} (${b.alive})</option>`).join('')}</select><label>تاريخ الفطام</label><input type="date" id="f3" value="${today()}"><label>عدد الصغار اللي اتفطموا</label><input type="number" inputmode="numeric" id="f4" value="${(o.find(b=>b.doe==id)||o[0]).alive}"><div class="acts"><button class="btn" onclick="saveWean()">حفظ</button><button class="btn s" onclick="closeS()">إلغاء</button></div>`)}
function saveWean(){const b=S.births.find(b=>b.id==V('f1'));b.weaned=true;b.weanDate=V('f3');b.weanedCount=+V('f4')||0;save();closeS();render();toast('تم الفطام')}
function saleForm(id){sheet('💰 تسجيل بيع',`<label>التاريخ</label><input type="date" id="f1" value="${today()}"><label>عدد الأرانب</label><input type="number" inputmode="numeric" id="f2" value="1"><label>إجمالي السعر (جنيه)</label><input type="number" inputmode="decimal" id="f3"><label>اسم المشتري (اختياري)</label><input id="f4"><label>من أم رقم (اختياري)</label><select id="f5"><option value="">-</option>${doeOpts(id)}</select><div class="acts"><button class="btn" onclick="saveSale()">حفظ</button><button class="btn s" onclick="closeS()">إلغاء</button></div>`)}
function saveSale(){const c=+V('f2');if(!c)return toast('اكتب العدد');S.sales.push({id:uid(),date:V('f1'),count:c,total:+V('f3')||0,buyer:V('f4'),doe:V('f5')});save();closeS();render();toast('تم التسجيل')}
function del(k,id){if(!confirm('متأكد من الحذف؟'))return;const m={m:'matings',b:'births',s:'sales'}[k];S[m]=S[m].filter(x=>x.id!==id);save();render()}
function doeView(id){
 const d=doe(id);if(!d)return;const ms=S.matings.filter(m=>m.doe==id).sort((a,b)=>b.date.localeCompare(a.date)),bs=S.births.filter(b=>b.doe==id).sort((a,b)=>b.date.localeCompare(a.date));
 const tot=bs.reduce((a,b)=>a+b.alive,0);
 sheet('🐰 الأنثى '+esc(d.num),`<div style="margin-bottom:8px">${stTag(d)}</div>${d.note?'<div class="m">'+esc(d.note)+'</div>':''}
 <div class="acts"><button class="btn" onclick="closeS();matingForm('${id}')">💕 تزاوج</button><button class="btn" onclick="closeS();birthForm('${id}')">🍼 ولادة</button><button class="btn" onclick="closeS();weanForm('${id}')">✂️ فطام</button><button class="btn" onclick="closeS();saleForm('${id}')">💰 بيع</button></div>
 <div class="card"><h3>الولادات (${bs.length}) • إجمالي الصغار ${tot}</h3>${bs.map(b=>`<div class="row"><span>${fd(b.date)}<div class="m">الأب: ${esc(b.buck||'؟')}</div></span><span>${b.alive} حي ${b.dead?'/ '+b.dead+' نافق':''} ${b.weaned?'<span class="tag b">فُطم '+b.weanedCount+'</span>':''}</span></div>`).join('')||'<div class="m">لا يوجد</div>'}</div>
 <div class="card"><h3>التزاوج</h3>${ms.map(m=>`<div class="row"><span>${fd(m.date)} × ${esc(m.buck||'؟')}</span><span class="tag ${m.result==='pending'?'o':m.result==='born'?'':'r'}">${m.result==='pending'?'منتظرة':m.result==='born'?'ولدت':'فشل'}</span></div>`).join('')||'<div class="m">لا يوجد</div>'}</div>
 <div class="acts"><button class="btn d" onclick="delDoe('${id}')">حذف الأنثى</button><button class="btn s" onclick="closeS()">إغلاق</button></div>`)}
function delDoe(id){if(!confirm('حذف الأنثى وكل سجلاتها؟'))return;S.does=S.does.filter(d=>d.id!=id);S.matings=S.matings.filter(m=>m.doe!=id);S.births=S.births.filter(b=>b.doe!=id);save();closeS();render()}
// backup
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function exportData(){S.lastBackup=today();save();dl('rabbits-backup-'+today()+'.json',JSON.stringify(S),'application/json');render()}
function importData(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.does)throw 0;if(confirm('هيتم استبدال البيانات الحالية بالنسخة دي. متأكد؟')){S=d;save();render();toast('تم الاسترجاع')}}catch(e){alert('الملف غير صالح')}};r.readAsText(f)}
function exportCSV(){const rows=[['النوع','التاريخ','الأنثى','الذكر','عدد','المبلغ']];S.matings.forEach(m=>rows.push(['تزاوج',m.date,dn(m.doe),m.buck,'','']));S.births.forEach(b=>rows.push(['ولادة',b.date,dn(b.doe),b.buck,b.alive,'']));S.sales.forEach(s=>rows.push(['بيع',s.date,s.doe?dn(s.doe):'',s.buyer,s.count,s.total]));dl('rabbits.csv','\ufeff'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
render();
</script></body></html>
